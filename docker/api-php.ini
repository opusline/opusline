; OPcache tuning for the production image only. Not in apps/api/php.ini: that
; file is also read by the dev FrankenPHP binary, and validate_timestamps=0
; there would serve stale code after every edit.
;
; validate_timestamps=0 is safe here because a deploy is a new container.
; max_accelerated_files: the app plus the no-dev vendor tree is ~12,600 PHP
; files, over the 10,000 default — once that table fills, OPcache stops
; caching new files entirely.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.jit=tracing
opcache.jit_buffer_size=128M
