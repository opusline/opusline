# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,cts,mts,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: php
      group:
        piped: true
        jobs:
          - name: rector
            root: "apps/api/"
            glob: "*.php"
            run: sh scripts/php.sh php vendor/bin/rector process --no-diffs {staged_files}
            stage_fixed: true

          - name: pint
            root: "apps/api/"
            glob: "*.php"
            run: sh scripts/php.sh php vendor/bin/pint {staged_files}
            stage_fixed: true

pre-push:
  jobs:
    - name: generated-artifacts
      group:
        piped: true
        jobs:
          - name: spec-and-client
            run: pnpm exec turbo run generate --output-logs=errors-only

          - name: route-tree
            run: pnpm --filter @opusline/web generate-routes

          - name: drift
            fail_text: "Generated files are stale. The fresh output is already in your working tree — commit it, then push again."
            run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src apps/web/src/routeTree.gen.ts

    - name: quality
      run: pnpm exec turbo run test check-types lint format-and-lint --output-logs=errors-only

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
