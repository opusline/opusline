# https://lefthook.dev/configuration/

pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,cts,mts,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: pint
      root: "apps/api/"
      glob: "*.php"
      run: vendor/bin/pint {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
