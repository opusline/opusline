# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,cts,mts,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: php
      group:
        piped: true
        jobs:
          - name: rector
            root: "apps/api/"
            glob: "*.php"
            run: sh scripts/php.sh php vendor/bin/rector process --no-diffs {staged_files}
            stage_fixed: true

          - name: pint
            root: "apps/api/"
            glob: "*.php"
            run: sh scripts/php.sh php vendor/bin/pint --cache-file=.cache/pint.json {staged_files}
            stage_fixed: true

pre-push:
  jobs:
    - name: generated-artifacts
      group:
        piped: true
        jobs:
          - name: openapi-spec
            run: pnpm exec turbo run @opusline/api#generate --output-logs=errors-only

          - name: client-routes-and-drift
            run: sh scripts/generated-artifacts.sh

    - name: i18n-guard
      run: sh scripts/i18n-guard.sh

    - name: release-notes-guard
      run: sh scripts/release-notes-guard.sh

    - name: compose-doc-guard
      run: sh scripts/compose-doc-guard.sh

    - name: quality
      group:
        piped: true
        jobs:
          - name: api
            run: pnpm exec turbo run test check-types lint --filter=@opusline/api --output-logs=errors-only

          - name: everything
            run: pnpm exec turbo run build test check-types lint format-and-lint --output-logs=errors-only

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
