name: Bug report
description: Something in Opusline is broken
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong? Paste error messages without secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. See…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Opusline version
      description: Shown in the app footer, or the release tag you deployed.
      placeholder: 0.35.0 # x-release-please-version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run it (compose release, dev stack), database, browser. No credentials, no unredacted .env.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / backend
        - Web UI
        - Self-hosting / Docker
        - Other
    validations:
      required: true
