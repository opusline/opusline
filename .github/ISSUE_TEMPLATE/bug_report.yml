name: Bug report
description: Something in Opusline is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: Steps to reproduce, what you saw, error messages…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Opusline version
      description: Shown in the app footer, or the release tag you deployed.
      placeholder: 0.20.1 # x-release-please-version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / backend
        - Web UI
        - Self-hosting / Docker
        - Other
    validations:
      required: true
