name: Stale Branches
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # at 06:00 every day between Monday and Friday

jobs:
  stale_branches:
    runs-on: ubuntu-latest

    steps:
      - name: Stale Branches
        uses: crs-k/stale-branches@v9.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 14
          days-before-delete: 30
          comment-updates: false
          ignore-issue-interaction: true
          pr-check: true