name: Stale Branches
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # at 06:00 every day between Monday and Friday

# The only workflow that was running on the repository default of `read`, which
# is not enough to delete a branch or open the tracking issue. It reports success
# in seconds today only because there is nothing stale to act on.
permissions:
  contents: write
  issues: write

jobs:
  stale_branches:
    runs-on: ubuntu-latest

    steps:
      - name: Stale Branches
        uses: crs-k/stale-branches@138918e25f06d439bf76db5305a591d8a3c03678 # v10.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 14
          days-before-delete: 30
          comment-updates: false
          ignore-issue-interaction: true
          pr-check: true
