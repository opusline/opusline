name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Every push to main runs the job above; only the one that merges the release
  # PR sets release_created, so the images are built for releases and nothing
  # else. Chained here rather than triggered by the release event because the
  # release is created with GITHUB_TOKEN, which fires no workflows.
  publish-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.release-please.outputs.version }}
