name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Every push to main runs the job above; only the one that merges the release
  # PR sets release_created, so the images are built for releases and nothing
  # else. Chained here rather than triggered by the release event because the
  # release is created with GITHUB_TOKEN, which fires no workflows.
  publish-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.release-please.outputs.version }}

  # The compose file and env example a self-hoster downloads must match the
  # images the release publishes, so they are attached to the release rather
  # than read from main — main moves between releases. Not ordered after
  # publish-images: the compose names images only through OPUSLINE_VERSION, so
  # the asset is correct whichever job finishes first. The env example is
  # served as example.env because GitHub delivers dotfile assets as hidden
  # files, and its inline commands get the release's own tag stamped in so a
  # pinned install never runs a :latest one-off by accident.
  release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          cp .env.production.example example.env
          sed -i \
            -e "s|opusline-api:latest php artisan key:generate|opusline-api:${VERSION} php artisan key:generate|" \
            -e "s|^# OPUSLINE_VERSION=.*|# OPUSLINE_VERSION=${VERSION}|" \
            example.env
          # If the example's wording drifts from these patterns, fail the
          # release instead of shipping an asset that silently kept :latest.
          grep -q "opusline-api:${VERSION}" example.env
          grep -q "^# OPUSLINE_VERSION=${VERSION}" example.env
          gh release upload "$TAG" compose.prod.yaml example.env --clobber
