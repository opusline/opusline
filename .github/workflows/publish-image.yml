name: Publish Images

# Only for a release. release-please calls this from its own run once it has cut
# one, because it creates the release with GITHUB_TOKEN and GitHub does not fire
# `release` events for those — a `release: published` trigger here would look
# right and never run.
on:
  workflow_call:
    inputs:
      version:
        description: The released version, without the leading v.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: The version to tag the images with, without the leading v.
        required: true
        type: string

concurrency:
  group: publish-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the build attach a provenance attestation to the pushed digest, so
      # a self-hoster can verify the image came from this repository.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: opusline-api
            target: api
          - image: opusline-web
            target: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `value=` rather than the ref: this runs on the push to main that cut
          # the release, so there is no tag ref to read the version from.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Opusline — time tracking, notes and mission management for freelancers
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ inputs.version }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          # arm64 too: a self-hoster's box is as likely to be an Apple silicon
          # machine or a Pi as it is an x86 VPS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
