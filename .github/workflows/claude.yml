name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      github.event.sender.login == 'Androlax2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # No `cache: pnpm`: this job runs in the default branch's cache scope, and
      # an install Claude runs on a PR head must not seed the store main's CI
      # restores.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # The action's defaults stop at editing files and committing onto the
          # branch it was invoked on, and anything outside the allowlist is
          # denied outright in this headless run. What is added here: the JS
          # toolchain (a dependency fix has to regenerate pnpm-lock.yaml),
          # branching off main for a fix that deserves its own pull request,
          # and opening that pull request instead of only linking to the
          # compare page. PHP is absent on purpose: it only runs in the Sail
          # containers, which this job does not boot.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Bash(pnpm install:*),Bash(pnpm update:*),Bash(pnpm audit:*),Bash(pnpm why:*),Bash(pnpm dedupe:*),Bash(pnpm knip),Bash(pnpm format-and-lint:*),Bash(pnpm exec turbo run:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch origin main),Bash(git switch:*),mcp__github__create_pull_request"
            --append-system-prompt "Once your commits are pushed to a branch that has no pull request yet, open one against main with mcp__github__create_pull_request rather than only linking to the compare page: the title is a Conventional Commit as CLAUDE.md describes, the body follows .github/pull_request_template.md. When a comment on an open pull request asks for the fix in a separate pull request, do not push to that pull request branch: run git fetch origin main, then git switch -c <type>/<short-name> FETCH_HEAD, commit there, push that branch and open its pull request."

