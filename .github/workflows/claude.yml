name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      github.event.sender.login == 'Androlax2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # checkout would otherwise leave the read-only workflow token in git's
          # config, where it outranks the app token the action puts on the
          # remote: Claude's pushes then fail as github-actions[bot] (403).
          persist-credentials: false

      # No `cache: pnpm`: this job runs in the default branch's cache scope, and
      # an install Claude runs on a PR head must not seed the store main's CI
      # restores.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Anything outside the allowlist is denied outright in this headless
          # run, and the action's defaults stop at editing files and committing
          # onto the branch it was invoked on. A narrower list kept stalling
          # real tasks halfway, so this one covers the whole contributor loop:
          # the JS toolchain and Playwright (pnpm exec playwright install
          # fetches its Chromium) to check a screen in a browser; Docker, to
          # boot the Sail stack or the production e2e stack and run PHP through
          # scripts/php.sh; git on several branches, for stacked pull requests;
          # the web, for docs; and the GitHub tools to open and update pull
          # requests. Docker hands the run the runner's daemon, which is
          # accepted because the job only fires for the maintainer.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(pnpx:*),Bash(npx playwright:*),Bash(node:*),Bash(turbo:*),Bash(docker:*),Bash(docker compose:*),Bash(sh scripts/:*),Bash(bash scripts/:*),Bash(sh apps/api/scripts/:*),Bash(sh apps/e2e/scripts/:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git merge:*),Bash(git restore:*),Bash(git stash:*),Bash(git rev-parse:*),Bash(curl -s http://localhost:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(wc:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(sleep:*),Bash(df:*),WebFetch,WebSearch,mcp__github__create_pull_request,mcp__github__update_pull_request,mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_status,mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__add_issue_comment,mcp__github__list_pull_requests"
            --append-system-prompt "Once your commits are pushed to a branch that has no pull request yet, open one against main with mcp__github__create_pull_request rather than only linking to the compare page: the title is a Conventional Commit as CLAUDE.md describes, the body follows .github/pull_request_template.md. When a comment on an open pull request asks for the fix in a separate pull request, do not push to that pull request branch: run git fetch origin main, then git switch -c <type>/<short-name> FETCH_HEAD, commit there, push that branch and open its pull request."

