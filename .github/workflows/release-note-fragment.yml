name: Release Note Fragment

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-note-fragment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-note-fragment:
    name: feat/fix PRs carry a release-note fragment
    if: >-
      github.actor != 'dependabot[bot]'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.user.login == 'github-actions[bot]')
      && !contains(github.event.pull_request.labels.*.name, 'no-release-note')
      && (startsWith(github.event.pull_request.title, 'feat')
      || startsWith(github.event.pull_request.title, 'fix'))
    runs-on: ubuntu-latest
    steps:
      - name: Require a fragment added under .release-notes/
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The job-level startsWith is a cheap prefilter that skips the runner
          # entirely for other types; this matches the exact conventional
          # feat/fix forms (with scope or breaking marker).
          case "$PR_TITLE" in
            "feat("*|"feat:"*|"feat!"*|"fix("*|"fix:"*|"fix!"*) ;;
            *)
              echo "PR type does not require a release-note fragment."
              exit 0
              ;;
          esac
          # The PR files API reports per-file status against the merge base,
          # so fragments that landed on the base branch after the PR opened
          # cannot satisfy the gate, and status "added" restricts it to
          # fragments this PR itself adds — all without cloning the repo.
          added_fragments=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            --jq '.[] | select(.status == "added") | select(.filename | test("^\\.release-notes/.*\\.json$")) | "\(.sha) \(.filename)"')
          if [ -z "$added_fragments" ]; then
            echo "::error::This feat/fix PR ships no release-note fragment. Add a JSON file under .release-notes/ (see .release-notes/README.md), or apply the 'no-release-note' label if nothing is user-visible."
            exit 1
          fi
          # Validate each fragment here, while its author is present, instead
          # of at release time in scripts/assemble-release-notes.mjs. Blob
          # shas from the files API resolve in the base repo even on fork PRs.
          while read -r blob_sha fragment; do
            if gh api "repos/${{ github.repository }}/git/blobs/$blob_sha" --jq '.content' \
              | base64 -d \
              | jq -e '(.kind | IN("new", "improved", "fixed")) and (.text | type == "string" and test("\\S"))' > /dev/null; then
              echo "$fragment is a valid release-note fragment."
            else
              echo "::error file=$fragment::Fragment must be JSON with a kind of new|improved|fixed and a non-empty text (see .release-notes/README.md)."
              exit 1
            fi
          done <<< "$added_fragments"
