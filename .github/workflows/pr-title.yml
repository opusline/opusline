name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title is a conventional commit
    # The PR author, not the event actor: the App's "update branch" pushes and
    # human title edits also fire this workflow on a Dependabot PR, and its
    # generated titles overrun the 50-character subject.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # commitlint and its config are root devDependencies, so the five
      # workspaces have nothing to contribute to linting one string.
      - run: pnpm install --frozen-lockfile --filter=opusline
      - run: echo "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
