name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  BROADCAST_CONNECTION: "null"

jobs:
  js:
    name: JS (biome, vitest, tsc)
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh scripts/i18n-guard.sh
      - run: sh scripts/release-notes-guard.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm --filter @opusline/storybook exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @opusline/storybook exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @opusline/storybook exec playwright install chromium --with-deps
      - run: pnpm format-and-lint
      - run: pnpm exec turbo run test check-types build "--filter=!@opusline/api"

  api-static:
    name: API static analysis (pint, rector, phpstan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: exif, gd
          coverage: none
      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - uses: actions/cache@v6
        with:
          path: apps/api/.cache
          key: php-tools-${{ hashFiles('apps/api/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            php-tools-${{ hashFiles('apps/api/composer.lock') }}-
            php-tools-
      - run: vendor/bin/pint --test --parallel --cache-file=.cache/pint.json
      - run: vendor/bin/rector process --dry-run
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  api-tests:
    name: API tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            DB_CONNECTION: sqlite
            DB_DATABASE: ":memory:"
          - database: mysql
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: "3306"
            DB_DATABASE: testing
            DB_USERNAME: root
            DB_PASSWORD: password
          - database: pgsql
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: "5432"
            DB_DATABASE: testing
            DB_USERNAME: postgres
            DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.DB_CONNECTION }}
      DB_HOST: ${{ matrix.DB_HOST }}
      DB_PORT: ${{ matrix.DB_PORT }}
      DB_DATABASE: ${{ matrix.DB_DATABASE }}
      DB_USERNAME: ${{ matrix.DB_USERNAME }}
      DB_PASSWORD: ${{ matrix.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: exif, gd, pdo_mysql, pdo_pgsql
          coverage: none
      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan config:clear --quiet && php artisan test --ci --parallel

  spec-drift:
    name: Generated artifacts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: exif, gd
          coverage: none
      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        working-directory: apps/api
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api
      - run: php artisan scramble:export --path=openapi.json
        working-directory: apps/api
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the client and route tree, and fail when they drift
        run: sh scripts/generated-artifacts.sh

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build:storybook

  audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: none
      - run: composer audit --locked
        working-directory: apps/api
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high
