version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @hey-api/openapi-ts needs the TS 5.x compiler API (packages/api-client
      # pins ^5.9.0); a grouped major bump to TS 7 breaks `pnpm generate-api`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
