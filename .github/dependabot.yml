version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
