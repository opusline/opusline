version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @hey-api/openapi-ts needs the TS 5.x compiler API (packages/api-client
      # pins ^5.9.0); a grouped major bump to TS 7 breaks `pnpm generate-api`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # jsdom 30.1 hides its Blob impl behind a private field, which breaks the
      # shim vitest's jsdom environment uses to hand Blob/File bodies to fetch
      # (vitest-dev/vitest#11294): every FormData upload throws in tests. Pinned
      # in apps/web until a vitest release reads the bytes another way.
      - dependency-name: jsdom
        versions: [">=30.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
