codecov:
  require_ci_to_pass: true

# Coverage reports, it does not gate: no codecov context is in the branch
# ruleset, so a failing status here would sit red on a pull request nothing
# waits for. `informational` says that out loud — the 80 % targets are the
# number the PR comment holds each flag to, not a merge condition. Putting
# `codecov/patch/api` and `codecov/patch/web` in the ruleset is what would turn
# them into one.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      api:
        target: 80%
        flags: [api]
        informational: true
      web:
        target: 80%
        flags: [web]
        informational: true

flags:
  api:
    paths:
      - apps/api/app/
      - apps/api/packages/
    carryforward: true
  web:
    paths:
      - apps/web/src/
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, condensed_files"
  after_n_builds: 2
  require_changes: true

ignore:
  - packages/api-client
  - apps/web/src/paraglide
